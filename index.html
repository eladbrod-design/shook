<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>רשימת קניות משפחתית</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Heebo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Heebo', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Heebo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9999px;
        }
        .item-checked {
            text-decoration: line-through;
            opacity: 0.6;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-emerald-600 text-white sticky top-0 z-30 shadow-md">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="p-2 bg-emerald-500/40 rounded-xl text-xl">🛒</span>
                <div>
                    <h1 class="text-lg font-bold tracking-wide leading-tight">קניות של המשפחה</h1>
                    <p id="summaryText" class="text-xs text-emerald-100">0 מוצרים ברשימה</p>
                </div>
            </div>
            <div class="flex items-center gap-1">
                <button onclick="shareWhatsApp()" title="שתף בוואטסאפ" class="p-2.5 rounded-xl bg-emerald-700/60 hover:bg-emerald-700 active:scale-95 transition text-emerald-100 hover:text-white flex items-center gap-1 text-sm font-medium">
                    <i class="fa-brands fa-whatsapp text-lg text-emerald-200"></i>
                    <span class="hidden sm:inline">וואטסאפ</span>
                </button>
                <button onclick="openMenuModal()" title="אפשרויות נוספות" class="p-2.5 rounded-xl bg-emerald-700/60 hover:bg-emerald-700 active:scale-95 transition text-emerald-100 hover:text-white">
                    <i class="fa-solid fa-ellipsis-vertical text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-md mx-auto w-full p-4 flex-1 pb-28">

        <!-- Input Box Section -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-3 mb-4">
            <form id="itemForm" onsubmit="handleAddItem(event)" class="flex flex-col gap-2.5">
                <div class="flex gap-2">
                    <input type="text" id="itemName" placeholder="מה להוסיף לרשימה? (למשל: חלב 3%)" required
                           class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3.5 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:bg-white transition">
                    <input type="number" id="itemQty" value="1" min="1" max="99" title="כמות"
                           class="w-16 text-center bg-slate-50 border border-slate-200 rounded-xl px-2 py-2.5 text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <!-- Category Selector -->
                <div class="flex items-center gap-2 overflow-x-auto py-1 scrollbar-none" id="categoryChips">
                    <!-- Populated via JS -->
                </div>

                <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.98] text-white font-semibold py-2.5 rounded-xl text-sm transition shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-plus"></i>
                    <span>הוסף לרשימה</span>
                </button>
            </form>
        </div>

        <!-- Filter / Quick Search -->
        <div class="flex items-center justify-between mb-3 px-1">
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">פריטים לקנייה</span>
            <div class="flex items-center gap-1.5 text-xs text-slate-500 bg-white px-2.5 py-1 rounded-lg border border-slate-200">
                <i class="fa-solid fa-filter text-[10px]"></i>
                <select id="filterCategory" onchange="renderList()" class="bg-transparent focus:outline-none font-medium cursor-pointer">
                    <option value="all">כל הקטגוריות</option>
                </select>
            </div>
        </div>

        <!-- Active Items Container -->
        <div id="activeList" class="space-y-3">
            <!-- Dynamically populated categories and items -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12 px-4">
            <div class="w-16 h-16 bg-emerald-50 text-emerald-500 rounded-full flex items-center justify-center mx-auto mb-3 text-2xl">
                ✨
            </div>
            <h3 class="text-base font-bold text-slate-700">הרשימה שלכם ריקה!</h3>
            <p class="text-xs text-slate-500 mt-1 max-w-xs mx-auto">הוסיפו פריטים חדשים למעלה או שתפו את הרשימה עם בני הבית בוואטסאפ.</p>
        </div>

        <!-- Completed Items Section -->
        <div id="completedSection" class="mt-6 pt-4 border-t border-slate-200/80 hidden">
            <div class="flex items-center justify-between mb-2 px-1">
                <button onclick="toggleCompletedAccordion()" class="flex items-center gap-2 text-xs font-bold text-slate-600 hover:text-slate-800">
                    <i id="accordionIcon" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                    <span>נרכשו / בעגלה (<span id="completedCount">0</span>)</span>
                </button>
                <button onclick="clearCompleted()" class="text-xs text-rose-500 hover:text-rose-700 font-medium">
                    נקה נקנו
                </button>
            </div>
            <div id="completedList" class="space-y-1.5 transition-all">
                <!-- Dynamically populated checked items -->
            </div>
        </div>

    </main>

    <!-- Quick Floating Action Bar for Mobile -->
    <nav class="fixed bottom-0 left-0 right-0 bg-white/95 backdrop-blur-md border-t border-slate-200 py-2.5 px-4 z-20">
        <div class="max-w-md mx-auto flex items-center justify-around gap-2">
            <button onclick="shareWhatsApp()" class="flex-1 flex items-center justify-center gap-2 bg-emerald-600 active:bg-emerald-700 text-white py-2 px-4 rounded-xl font-medium text-sm shadow-sm transition">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>שלח בוואטסאפ</span>
            </button>
            <button onclick="copyShareableLink()" class="flex items-center justify-center gap-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 px-3 rounded-xl font-medium text-xs transition border border-slate-200">
                <i class="fa-solid fa-link"></i>
                <span>העתק קישור</span>
            </button>
        </div>
    </nav>

    <!-- Modal for Options / Menu -->
    <div id="menuModal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center hidden" onclick="closeMenuModal(event)">
        <div class="bg-white w-full max-w-sm rounded-t-2xl sm:rounded-2xl p-5 shadow-2xl transition-all" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between pb-3 border-b border-slate-100">
                <h3 class="font-bold text-base text-slate-800">ניהול רשימה</h3>
                <button onclick="closeMenuModal()" class="text-slate-400 hover:text-slate-600 p-1">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>
            <div class="py-3 space-y-2">
                <button onclick="copyFormattedText()" class="w-full text-right p-3 rounded-xl hover:bg-slate-50 flex items-center justify-between text-sm font-medium text-slate-700">
                    <span class="flex items-center gap-2.5">
                        <i class="fa-regular fa-copy text-emerald-600"></i>
                        <span>העתק רשימה כטקסט</span>
                    </span>
                    <i class="fa-solid fa-chevron-left text-xs text-slate-400"></i>
                </button>
                <button onclick="exportJSON()" class="w-full text-right p-3 rounded-xl hover:bg-slate-50 flex items-center justify-between text-sm font-medium text-slate-700">
                    <span class="flex items-center gap-2.5">
                        <i class="fa-solid fa-file-export text-blue-600"></i>
                        <span>ייצא גיבוי (קובץ)</span>
                    </span>
                    <i class="fa-solid fa-chevron-left text-xs text-slate-400"></i>
                </button>
                <label class="w-full text-right p-3 rounded-xl hover:bg-slate-50 flex items-center justify-between text-sm font-medium text-slate-700 cursor-pointer">
                    <span class="flex items-center gap-2.5">
                        <i class="fa-solid fa-file-import text-amber-600"></i>
                        <span>ייבא מרשימה מגובה</span>
                    </span>
                    <input type="file" id="importFileInput" accept=".json" onchange="importJSON(event)" class="hidden">
                    <i class="fa-solid fa-chevron-left text-xs text-slate-400"></i>
                </label>
                <button onclick="confirmClearAll()" class="w-full text-right p-3 rounded-xl hover:bg-rose-50 text-rose-600 flex items-center justify-between text-sm font-medium">
                    <span class="flex items-center gap-2.5">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>מחק את כל הרשימה</span>
                    </span>
                    <i class="fa-solid fa-chevron-left text-xs text-rose-300"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-900/90 text-white px-4 py-2.5 rounded-full text-xs font-medium shadow-lg z-50 flex items-center gap-2 transition-all opacity-0 pointer-events-none translate-y-[-10px]">
        <i id="toastIcon" class="fa-solid fa-check text-emerald-400"></i>
        <span id="toastMsg">הודעה</span>
    </div>

    <script>
        // Categories Definitions
        const CATEGORIES = [
            { id: 'dairy', name: 'מוצרי חלב', icon: '🧀', color: 'bg-amber-100 text-amber-800' },
            { id: 'produce', name: 'ירקות ופירות', icon: '🥑', color: 'bg-lime-100 text-lime-800' },
            { id: 'bakery', name: 'מאפים ולחם', icon: '🥖', color: 'bg-orange-100 text-orange-800' },
            { id: 'meat', name: 'בשר ודגים', icon: '🥩', color: 'bg-rose-100 text-rose-800' },
            { id: 'pantry', name: 'מזווה ויבשים', icon: '🥫', color: 'bg-yellow-100 text-yellow-800' },
            { id: 'cleaning', name: 'ניקיון ופארם', icon: '🧼', color: 'bg-cyan-100 text-cyan-800' },
            { id: 'general', name: 'שונות', icon: '📦', color: 'bg-slate-100 text-slate-800' },
        ];

        let selectedCategory = 'dairy';
        let items = [];
        let isCompletedOpen = true;

        // Initialize App
        window.addEventListener('DOMContentLoaded', () => {
            initCategoryChips();
            initFilterOptions();
            loadItems();
            checkUrlForSharedData();
            renderList();
        });

        // Initialize category selector chips
        function initCategoryChips() {
            const container = document.getElementById('categoryChips');
            container.innerHTML = CATEGORIES.map(cat => `
                <button type="button" onclick="selectCategory('${cat.id}')"
                        id="chip-${cat.id}"
                        class="px-2.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border ${cat.id === selectedCategory ? 'bg-emerald-600 text-white border-emerald-600 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200'}">
                    ${cat.icon} ${cat.name}
                </button>
            `).join('');
        }

        // Initialize category filter dropdown
        function initFilterOptions() {
            const filter = document.getElementById('filterCategory');
            CATEGORIES.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.textContent = `${cat.icon} ${cat.name}`;
                filter.appendChild(opt);
            });
        }

        // Change active category chip
        function selectCategory(id) {
            selectedCategory = id;
            CATEGORIES.forEach(cat => {
                const el = document.getElementById(`chip-${cat.id}`);
                if (!el) return;
                if (cat.id === id) {
                    el.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border bg-emerald-600 text-white border-emerald-600 shadow-sm";
                } else {
                    el.className = "px-2.5 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition border bg-slate-100 text-slate-600 border-slate-200 hover:bg-slate-200";
                }
            });
        }

        // Storage helpers
        function saveItems() {
            localStorage.setItem('family_shopping_list_items', JSON.stringify(items));
        }

        function loadItems() {
            try {
                const saved = localStorage.getItem('family_shopping_list_items');
                if (saved) {
                    items = JSON.parse(saved);
                } else {
                    // Default initial items
                    items = [
                        { id: '1', name: 'חלב תנובה 3%', qty: 2, category: 'dairy', completed: false, createdAt: Date.now() },
                        { id: '2', name: 'עגבניות ומלפפונים לסלט', qty: 1, category: 'produce', completed: false, createdAt: Date.now() - 1000 },
                        { id: '3', name: 'חלות לשבת', qty: 2, category: 'bakery', completed: true, createdAt: Date.now() - 2000 },
                    ];
                    saveItems();
                }
            } catch (e) {
                items = [];
            }
        }

        // Add Item
        function handleAddItem(e) {
            e.preventDefault();
            const nameInput = document.getElementById('itemName');
            const qtyInput = document.getElementById('itemQty');
            const name = nameInput.value.trim();
            const qty = parseInt(qtyInput.value, 10) || 1;

            if (!name) return;

            const newItem = {
                id: 'item_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                name,
                qty,
                category: selectedCategory,
                completed: false,
                createdAt: Date.now()
            };

            items.unshift(newItem);
            saveItems();
            renderList();

            nameInput.value = '';
            qtyInput.value = '1';
            nameInput.focus();
            showToast('הפריט נוסף בהצלחה!');
        }

        // Toggle Item Completion
        function toggleItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                item.completed = !item.completed;
                saveItems();
                renderList();
            }
        }

        // Delete Item
        function deleteItem(id) {
            items = items.filter(i => i.id !== id);
            saveItems();
            renderList();
            showToast('פריט הוסר');
        }

        // Update Item Quantity
        function updateQty(id, delta) {
            const item = items.find(i => i.id === id);
            if (item) {
                const newQty = item.qty + delta;
                if (newQty > 0) {
                    item.qty = newQty;
                    saveItems();
                    renderList();
                } else {
                    deleteItem(id);
                }
            }
        }

        // Edit Item Name
        function editItemName(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            const current = item.name;
            const updated = prompt('ערוך שם פריט:', current);
            if (updated !== null && updated.trim() !== '') {
                item.name = updated.trim();
                saveItems();
                renderList();
            }
        }

        // Render List UI
        function renderList() {
            const activeContainer = document.getElementById('activeList');
            const completedContainer = document.getElementById('completedList');
            const emptyState = document.getElementById('emptyState');
            const completedSection = document.getElementById('completedSection');
            const summaryText = document.getElementById('summaryText');
            const completedCountEl = document.getElementById('completedCount');
            const filterCat = document.getElementById('filterCategory').value;

            const filteredItems = filterCat === 'all' 
                ? items 
                : items.filter(i => i.category === filterCat);

            const activeItems = filteredItems.filter(i => !i.completed);
            const completedItems = filteredItems.filter(i => i.completed);

            // Update stats
            const pendingTotal = items.filter(i => !i.completed).length;
            summaryText.textContent = `${pendingTotal} מוצרים חסרים לקנייה`;
            completedCountEl.textContent = completedItems.length;

            // Empty state check
            if (activeItems.length === 0 && completedItems.length === 0) {
                activeContainer.innerHTML = '';
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
            }

            // Group active by category
            if (activeItems.length > 0) {
                const grouped = {};
                activeItems.forEach(item => {
                    if (!grouped[item.category]) grouped[item.category] = [];
                    grouped[item.category].push(item);
                });

                let html = '';
                CATEGORIES.forEach(cat => {
                    if (grouped[cat.id] && grouped[cat.id].length > 0) {
                        html += `
                            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden">
                                <div class="px-3 py-2 bg-slate-50/70 border-b border-slate-100 flex items-center justify-between text-xs font-bold text-slate-700">
                                    <span class="flex items-center gap-1.5">
                                        <span>${cat.icon}</span>
                                        <span>${cat.name}</span>
                                    </span>
                                    <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded-full text-[11px] font-semibold">
                                        ${grouped[cat.id].length}
                                    </span>
                                </div>
                                <div class="divide-y divide-slate-100">
                                    ${grouped[cat.id].map(item => renderItemRow(item)).join('')}
                                </div>
                            </div>
                        `;
                    }
                });
                activeContainer.innerHTML = html;
            } else {
                activeContainer.innerHTML = '';
            }

            // Render Completed
            if (completedItems.length > 0) {
                completedSection.classList.remove('hidden');
                completedContainer.innerHTML = completedItems.map(item => `
                    <div class="flex items-center justify-between p-2.5 bg-slate-200/50 rounded-xl border border-slate-200/50">
                        <div class="flex items-center gap-2.5 flex-1 min-w-0" onclick="toggleItem('${item.id}')">
                            <input type="checkbox" checked onchange="toggleItem('${item.id}')"
                                   class="w-4 h-4 rounded text-emerald-600 focus:ring-emerald-500 cursor-pointer">
                            <span class="text-xs font-medium text-slate-500 line-through truncate">${item.name}</span>
                            <span class="text-[11px] text-slate-400">(${item.qty})</span>
                        </div>
                        <button onclick="deleteItem('${item.id}')" class="text-slate-400 hover:text-rose-500 p-1 text-xs">
                            <i class="fa-solid fa-trash"></i>
                        </button>
                    </div>
                `).join('');
            } else {
                completedSection.classList.add('hidden');
            }
        }

        // Item HTML template
        function renderItemRow(item) {
            return `
                <div class="flex items-center justify-between p-3 gap-2 hover:bg-slate-50/60 transition group">
                    <div class="flex items-center gap-3 flex-1 min-w-0 cursor-pointer" onclick="toggleItem('${item.id}')">
                        <input type="checkbox" ${item.completed ? 'checked' : ''} onchange="toggleItem('${item.id}')"
                               class="w-5 h-5 rounded-lg border-slate-300 text-emerald-600 focus:ring-emerald-500 cursor-pointer transition">
                        <div class="truncate">
                            <p class="text-sm font-semibold text-slate-800 leading-snug truncate">${item.name}</p>
                        </div>
                    </div>
                    
                    <div class="flex items-center gap-2">
                        <!-- Qty Buttons -->
                        <div class="flex items-center border border-slate-200 rounded-lg bg-slate-50 overflow-hidden text-xs">
                            <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 flex items-center justify-center hover:bg-slate-200 text-slate-600 active:scale-95 font-bold">-</button>
                            <span class="px-2 font-bold text-slate-700 min-w-[1.2rem] text-center">${item.qty}</span>
                            <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 flex items-center justify-center hover:bg-slate-200 text-slate-600 active:scale-95 font-bold">+</button>
                        </div>
                        
                        <!-- Quick actions -->
                        <button onclick="editItemName('${item.id}')" title="עריכה" class="text-slate-400 hover:text-slate-600 p-1.5 rounded-lg">
                            <i class="fa-solid fa-pen text-xs"></i>
                        </button>
                        <button onclick="deleteItem('${item.id}')" title="מחיקה" class="text-slate-400 hover:text-rose-500 p-1.5 rounded-lg">
                            <i class="fa-solid fa-trash text-xs"></i>
                        </button>
                    </div>
                </div>
            `;
        }

        // WhatsApp Share Generator
        function shareWhatsApp() {
            const activeItems = items.filter(i => !i.completed);
            if (activeItems.length === 0) {
                showToast('אין פריטים לקנייה ברשימה כרגע!');
                return;
            }

            const grouped = {};
            activeItems.forEach(item => {
                if (!grouped[item.category]) grouped[item.category] = [];
                grouped[item.category].push(item);
            });

            let text = `🛒 *רשימת קניות משפחתית*\n`;
            text += `סה"כ פריטים חסרים: ${activeItems.length}\n`;
            text += `--------------------------\n`;

            CATEGORIES.forEach(cat => {
                if (grouped[cat.id] && grouped[cat.id].length > 0) {
                    text += `\n*${cat.icon} ${cat.name}:*\n`;
                    grouped[cat.id].forEach(it => {
                        const countStr = it.qty > 1 ? ` (${it.qty})` : '';
                        text += `▫️ ${it.name}${countStr}\n`;
                    });
                }
            });

            text += `\nנקנה באהבה! ❤️`;

            const encoded = encodeURIComponent(text);
            window.open(`https://api.whatsapp.com/send?text=${encoded}`, '_blank');
        }

        // Copy Plain Text
        function copyFormattedText() {
            const activeItems = items.filter(i => !i.completed);
            if (activeItems.length === 0) {
                showToast('הרשימה ריקה');
                return;
            }
            let text = `רשימת קניות:\n` + activeItems.map(i => `- ${i.name} (${i.qty})`).join('\n');
            copyToClipboard(text);
            closeMenuModal();
            showToast('הרשימה הועתקה ללוח');
        }

        // Shareable Link with embedded state
        function copyShareableLink() {
            try {
                const json = JSON.stringify(items);
                const encodedData = encodeURIComponent(btoa(unescape(encodeURIComponent(json))));
                const shareUrl = `${window.location.origin}${window.location.pathname}?data=${encodedData}`;
                copyToClipboard(shareUrl);
                showToast('קישור לרשימה הועתק לשיתוף!');
            } catch (e) {
                showToast('שגיאה ביצירת קישור');
            }
        }

        // Check if list was opened from a shared link
        function checkUrlForSharedData() {
            const params = new URLSearchParams(window.location.search);
            const data = params.get('data');
            if (data) {
                try {
                    const decoded = decodeURIComponent(escape(atob(decodeURIComponent(data))));
                    const parsed = JSON.parse(decoded);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        items = parsed;
                        saveItems();
                        showToast('הרשימה המשותפת נטענה בהצלחה!');
                        // Remove param from URL cleanly
                        window.history.replaceState({}, document.title, window.location.pathname);
                    }
                } catch (e) {
                    console.error('Error importing from URL', e);
                }
            }
        }

        // Export/Import JSON
        function exportJSON() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(items, null, 2));
            const dlAnchor = document.createElement('a');
            dlAnchor.setAttribute("href", dataStr);
            dlAnchor.setAttribute("download", `shopping-list-${new Date().toISOString().slice(0,10)}.json`);
            dlAnchor.click();
            closeMenuModal();
        }

        function importJSON(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        items = imported;
                        saveItems();
                        renderList();
                        showToast('הרשימה יובאה בהצלחה!');
                        closeMenuModal();
                    }
                } catch (err) {
                    showToast('קובץ לא תקין');
                }
            };
            reader.readAsText(file);
        }

        // Clear utilities
        function clearCompleted() {
            items = items.filter(i => !i.completed);
            saveItems();
            renderList();
            showToast('הפריטים שנרכשו נוקו');
        }

        function confirmClearAll() {
            if (confirm('בטוח שברצונך למחוק את כל המוצרים ברשימה?')) {
                items = [];
                saveItems();
                renderList();
                closeMenuModal();
                showToast('הרשימה אופסה');
            }
        }

        function toggleCompletedAccordion() {
            const list = document.getElementById('completedList');
            const icon = document.getElementById('accordionIcon');
            isCompletedOpen = !isCompletedOpen;
            if (isCompletedOpen) {
                list.classList.remove('hidden');
                icon.classList.remove('-rotate-90');
            } else {
                list.classList.add('hidden');
                icon.classList.add('-rotate-90');
            }
        }

        // UI Modals & Helpers
        function openMenuModal() {
            document.getElementById('menuModal').classList.remove('hidden');
        }

        function closeMenuModal() {
            document.getElementById('menuModal').classList.add('hidden');
        }

        function copyToClipboard(text) {
            const temp = document.createElement('textarea');
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand('copy');
            document.body.removeChild(temp);
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            toastMsg.textContent = msg;
            toast.classList.remove('opacity-0', 'translate-y-[-10px]');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-[-10px]');
            }, 2500);
        }
    </script>
</body>
</html>
